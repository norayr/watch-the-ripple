[btservice]
address =
process_sleep = 0.25
connect_sleep = 30
time_sleep = 4
[media]
use_oscp = True

[notifications]
# Filesystem changes wake the scanner immediately; this is a safety rescan.
fallback_seconds = 30

[filter.omemo]
# Matches both "This message is OMEMO encrypted" and
# "I sent you an OMEMO encrypted message...", ignoring ASCII letter case.
body_contains = OMEMO encrypted
action = once_per_contact
# 0 = once per contact/channel per daemon run; 3600 = at most once per hour.
cooldown_seconds = 0
